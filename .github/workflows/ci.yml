name: CI

on:
  push:
    branches: ["main", "claude/**", "feat/**", "work"]
  pull_request:
    branches: ["main"]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only PyTorch: a much smaller download than the default CUDA build.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Lint
        run: |
          ruff check src tests scripts
          black --check src tests scripts
      - name: Pytest
        run: pytest -q
      - name: Smoke run of the full pipeline (configs/quick.yaml)
        run: |
          python scripts/run_all.py --config configs/quick.yaml \
            --artifacts_root "$RUNNER_TEMP/artifacts" --results_root "$RUNNER_TEMP/results"
