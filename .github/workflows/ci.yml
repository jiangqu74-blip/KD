name: CI

on:
  push:
    branches: ["main", "feat/**", "work"]
  pull_request:
    branches: ["main"]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint
        run: |
          ruff check src tests
          black --check src tests
      - name: Pytest
        run: pytest -q
      - name: Smoke pipeline (reduced config)
        env:
          OUT_DIR: artifacts_ci
        run: |
          python -m src.main --mode train_teacher --out_dir $OUT_DIR --device cpu \
            --L 1 --hidden_dim 32 --K_edge 16 --K_node 16 --M_levels 1 --epochs 2 --lr 5e-3 \
            --n_nodes 200 --n_edges 150 --feat_dim 8 --n_classes 3 --max_edge 20 --min_edge 3 --p_mixed 0.3
          python -m src.main --mode export_distill --out_dir $OUT_DIR --device cpu
          python -m src.main --mode train_student --ablation kd --out_dir $OUT_DIR --device cpu \
            --epochs 2 --lr 5e-3 --hidden_dim_student 32
          python -m src.main --mode train_student --ablation kd_topk --out_dir $OUT_DIR --device cpu \
            --epochs 2 --lr 5e-3 --hidden_dim_student 32
          python -m src.main --mode eval --out_dir $OUT_DIR --device cpu
          python scripts/update_report.py --out_dir $OUT_DIR --report docs/REPORT.md --plot_target docs/student_ablation.png
