repos:
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.5
    hooks:
      - id: ruff
  - repo: https://github.com/pytest-dev/pytest
    rev: 8.1.1
    hooks:
      - id: pytest
        additional_dependencies: []
